# fly.toml app configuration file generated for cossyreign-developed-bot-h4pvuw on 2026-07-24T18:35:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cossyreign-developed-bot-h4pvuw'
primary_region = 'jnb'

[build]

[env]
  NODE_ENV = 'production'

[processes]
  app = 'node connect.js'

[[mounts]]
  source = 'sessions'
  destination = '/app/sessions'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
